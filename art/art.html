<!doctype html>
<!-- Source for the app icon, splash and store/portal art. Rendered to PNG by art/render.mjs (npm run art). -->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Lilita One'; src: url('../node_modules/@fontsource/lilita-one/files/lilita-one-latin-400-normal.woff2') format('woff2'); }
  html, body { margin: 0; overflow: hidden; }
  #c { position: relative; overflow: hidden; }
  svg { display: block; }
  .title { font-family: 'Lilita One', sans-serif; fill: #fff; stroke: #25193f; stroke-linejoin: round; paint-order: stroke fill; letter-spacing: .02em; }
</style>
</head>
<body>
<div id="c"></div>
<script>
// ?kind=icon|icon-fg|icon-bg|splash|feature|cover|square&w=..&h=..
const q = new URLSearchParams(location.search);
const kind = q.get('kind'), W = +q.get('w'), H = +q.get('h');
const INK = '#25193f';

const sky = (w, h) => `
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5cc4f5"/><stop offset="1" stop-color="#b8ecff"/></linearGradient></defs>
  <rect width="${w}" height="${h}" fill="url(#sky)"/>`;
const cloud = (x, y, s) => `<g fill="rgba(255,255,255,.8)" transform="translate(${x} ${y}) scale(${s})"><circle cx="0" cy="0" r="18"/><circle cx="20" cy="-8" r="22"/><circle cx="44" cy="0" r="17"/></g>`;
const hills = (w, h, y) => {
  let a = `M0 ${h}`, b = `M0 ${h}`;
  for (let x = 0; x <= w + 20; x += 20) { a += ` L${x} ${y + Math.sin(x * 0.018 / (w / 400)) * 30 * (w / 400) * 0.5}`; b += ` L${x} ${y + 50 * (w / 400) * 0.5 + Math.sin(x * 0.025 / (w / 400) + 2) * 22 * (w / 400) * 0.5}`; }
  return `<path d="${a} L${w + 20} ${h} Z" fill="#9fe39a"/><path d="${b} L${w + 20} ${h} Z" fill="#7bd57c"/>`;
};
// the menu mascot (viewBox 0 0 120 140)
const drop = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})">
  <path d="M60 6C60 6 14 62 14 90a46 46 0 0 0 92 0C106 62 60 6 60 6z" fill="#1d78ff" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/>
  <path d="M34 82c2-14 10-26 16-34" stroke="#8cc8ff" stroke-width="7" stroke-linecap="round" fill="none"/>
  <circle cx="46" cy="94" r="10" fill="#fff" stroke="${INK}" stroke-width="3"/><circle cx="78" cy="94" r="10" fill="#fff" stroke="${INK}" stroke-width="3"/>
  <circle cx="49" cy="96" r="4.5" fill="${INK}"/><circle cx="81" cy="96" r="4.5" fill="${INK}"/>
  <path d="M50 114q12 9 24 0" stroke="${INK}" stroke-width="4" stroke-linecap="round" fill="none"/></g>`;
// a little game scene in playfield units (spring, riverbed, water, flower, pond); place with transform
const scene = () => {
  let water = '';
  const pts = [];
  for (let t = 0; t <= 1; t += 0.06) pts.push([70 + 150 * t, 112 + 55 * t]);       // on the riverbed
  for (let t = 0.1; t <= 1; t += 0.12) pts.push([228 + 70 * t, 172 + 150 * t * t]); // falling
  for (const [x, y] of pts) water += `<circle cx="${x}" cy="${y}" r="7"/>`;
  let pond = '';
  for (let r = 0; r < 3; r++) for (let k = 0; k < 8; k++) pond += `<circle cx="${264 + k * 10 + (r % 2) * 3}" cy="${396 - r * 11}" r="7"/>`;
  return `
  <g><ellipse cx="80" cy="56" rx="34" ry="30" fill="${INK}"/><ellipse cx="80" cy="55" rx="29" ry="25" fill="#8f86a8"/>
     <ellipse cx="72" cy="46" rx="12" ry="8" fill="#b3abc9" transform="rotate(-23 72 46)"/><ellipse cx="84" cy="32" rx="22" ry="8" fill="#4fcf6a"/></g>
  <path d="M60 128 L230 182" stroke="${INK}" stroke-width="13" stroke-linecap="round"/>
  <path d="M60 128 L230 182" stroke="#a5764e" stroke-width="7" stroke-linecap="round"/>
  <g fill="#1d78ff">${water}${pond}</g>
  <g transform="translate(150 250)"><path d="M0 12 L0 -10" stroke="#3aa957" stroke-width="4" stroke-linecap="round"/>
    <g transform="translate(0 -14)" fill="#ff4f8b">${[0, 1, 2, 3, 4].map((i) => `<ellipse cx="${Math.cos(i * 1.257) * 7}" cy="${Math.sin(i * 1.257) * 7}" rx="5" ry="4" transform="rotate(${i * 72} ${Math.cos(i * 1.257) * 7} ${Math.sin(i * 1.257) * 7})"/>`).join('')}<circle r="4" fill="#ffc82e"/></g></g>
  <path d="M250 330 L257 410 L343 410 L350 330" fill="none" stroke="${INK}" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M237 332 l5 -14 l4 12 l4 -14 l5 16 Z M357 332 l5 -14 l4 12 l4 -14 l5 16 Z" fill="#4fcf6a"/>`;
};
const title = (x, y, size, lines) => lines.map((t, i) =>
  `<text class="title" x="${x}" y="${y + i * size * 0.92}" font-size="${size}" text-anchor="middle" stroke-width="${size * 0.16}">${t}</text>`).join('');

let svg = '';
const m = Math.min(W, H);
if (kind === 'icon' || kind === 'icon-bg') {
  // full-bleed, opaque (App Store icons must not be transparent)
  svg = sky(W, H) + cloud(W * 0.1, H * 0.2, W / 400) + cloud(W * 0.68, H * 0.13, W / 520) + hills(W, H, H * 0.8);
  if (kind === 'icon') svg += drop(W * 0.18, H * 0.1, W / 175);
} else if (kind === 'icon-fg') {
  // Android adaptive foreground. @capacitor/assets already insets it by 16.7% per side, which lands it in the
  // launcher's safe zone, so fill the canvas here.
  const k = W / 155;
  svg = drop(W / 2 - 60 * k, H / 2 - 76 * k, k);
} else if (kind === 'splash') {
  svg = sky(W, H) + cloud(W * 0.15, H * 0.28, m / 500) + cloud(W * 0.7, H * 0.22, m / 650) + hills(W, H, H * 0.74)
    + drop(W / 2 - m * 0.11, H / 2 - m * 0.24, m / 545) + title(W / 2, H / 2 + m * 0.12, m * 0.085, ['DOODLE RIVER']);
} else {
  // feature graphic / portal covers: scene on one side, mascot + title on the other
  const portrait = H > W;
  svg = sky(W, H) + cloud(W * 0.08, H * 0.18, m / 300) + cloud(W * 0.55, H * 0.1, m / 420) + cloud(W * 0.85, H * 0.3, m / 380) + hills(W, H, H * 0.78);
  if (portrait || kind === 'square') {
    svg += `<g transform="translate(${W * 0.04} ${H * 0.32}) scale(${W / 620})">${scene()}</g>`
      + drop(W * 0.62, H * 0.06, m / 520) + title(W * 0.36, H * 0.16, m * 0.14, ['DOODLE', 'RIVER']);
  } else {
    svg += `<g transform="translate(${W * 0.02} ${H * 0.02}) scale(${H / 440})">${scene()}</g>`
      + drop(W * 0.655, H * 0.05, H / 560) + title(W * 0.73, H * 0.62, H * 0.19, ['DOODLE', 'RIVER']);
  }
}
const c = document.getElementById('c');
c.style.width = W + 'px'; c.style.height = H + 'px';
c.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${svg}</svg>`;
document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
